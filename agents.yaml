# Roster: which model backs which role (ADR-0006, ADR-0009; docs/budget-guardrails.md §1).
#
# Agents are defined once. A profile picks a model alias per role and one fallback for
# schema failures. The default profile spends nothing; a paid profile is always an
# explicit choice per run (`pnpm solve "…" --profile quality`).
#
# Read by apps/cli/src/adapters/yaml-subset.ts: block mappings, single-line `{ }` flow
# mappings, scalars and comments only.

defaultProfile: dev

models:
  sonnet: { provider: anthropic, model: claude-sonnet-5-5 }
  haiku: { provider: anthropic, model: claude-haiku-5-5 }
  # Local model pending the Phase 2 trial (ADR-0008 will record the choice).
  local: { provider: ollama, model: qwen3.6:35b-mlx, think: false }
  local-think: { provider: ollama, model: qwen3.6:35b-mlx, think: true }

profiles:
  dev: # zero API spend; the default
    fallback: none # schema failure → repair once → discard and log
    roles:
      planner: local
      researcher: local
      solver: local-think
      critic: local
      synthesizer: local
      bidder: local
  cheap: # ~1–2 cents per run
    fallback: haiku
    roles:
      planner: haiku
      researcher: local
      solver: local-think
      critic: haiku
      synthesizer: haiku
      bidder: haiku
  quality: # ~15–25 cents per run
    fallback: haiku
    roles:
      planner: haiku
      researcher: local
      solver: local-think
      critic: sonnet
      synthesizer: sonnet
      bidder: haiku

agents:
  planner: { prompt: prompts/planner.md }
  researcher: { prompt: prompts/researcher.md }
  solver: { prompt: prompts/solver.md }
  critic: { prompt: prompts/critic.md }
  synthesizer: { prompt: prompts/synthesizer.md }
